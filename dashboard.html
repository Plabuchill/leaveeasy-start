<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ดสรุป · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/auth-guard.js" type="module"></script>
  <script src="js/dashboard.js" type="module"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>แดชบอร์ดสรุป</h1>
    <p class="subtitle">ตัวเลขสรุปใบลาวันนี้และรายการใบลาล่าสุด</p>

    <div id="กล่องตัวเลข" class="status-summary">
      <div class="status-box">
        <div class="status-count">
          <a href="leave-requests.html?status=รอพิจารณา" class="count-link">
            <span id="นับรอพิจารณา">3</span>
          </a>
        </div>
        <div class="status-label">รอพิจารณา</div>
      </div>
      <div class="status-box">
        <div class="status-count">
          <a href="leave-requests.html?status=อนุมัติ" class="count-link">
            <span id="นับอนุมัติ">1</span>
          </a>
        </div>
        <div class="status-label">อนุมัติ</div>
      </div>
      <div class="status-box">
        <div class="status-count">
          <a href="leave-requests.html?status=ไม่อนุมัติ" class="count-link">
            <span id="นับไม่อนุมัติ">1</span>
          </a>
        </div>
        <div class="status-label">ไม่อนุมัติ</div>
      </div>
    </div>

    <div class="card">
      <h2>ใบลาล่าสุด 5 รายการ</h2>
      <div id="ตารางล่าสุด"></div>
    </div>

    <div class="btn-row">
      <a class="btn" href="leave-requests.html">ดูรายการทั้งหมด</a>
    </div>
  </div>
</body>
</html>
